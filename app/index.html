<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2時のデバッグ — music video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9aa6c2; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 34px 0; display: flex; align-items: center; justify-content: center; }
  canvas#c { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; padding: 0 10px; box-sizing: border-box; background: #05060b; display: flex; gap: 12px; align-items: center; }
  #ui.hidden { display: none; }
  #ui button { background: #161b2e; color: #eef2fa; border: 0; padding: 4px 10px; cursor: pointer; }
  #bar { flex: 1; height: 10px; background: #161b2e; position: relative; cursor: pointer; }
  #bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #2f6bff; pointer-events: none; }
  #bar .mark { position: absolute; top: -4px; bottom: -4px; width: 1px; background: #55607e; pointer-events: none; }
  #start { position: fixed; inset: 0 0 34px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(5,6,11,0.55); color: #eef2fa; cursor: default; font: 600 16px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; letter-spacing: 0.08em; }
  #start .btn { width: 108px; height: 108px; border-radius: 50%; border: 2px solid #62e6ff; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #62e6ff; box-shadow: 0 0 40px rgba(98,230,255,0.35); opacity: 0.35; }
  #start.ready { cursor: pointer; }
  #start.ready .btn { opacity: 1; }
  #start.gone { display: none; }
  body.export #ui, body.export #start { display: none; }
  body.export #wrap { inset: 0; display: block; }
  body.export canvas#c { width: 1920px; height: 1080px; max-width: none; max-height: none; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="start"><div class="btn">▶</div><div>2時のデバッグ — 再生 / play</div><div style="opacity:.6;font-weight:400;font-size:13px">rendered live in your browser · space = play/pause · ←/→ seek</div></div>
  <div id="ui"><button id="play">▶</button><span id="time">loading…</span><div id="bar"><div class="fill"></div></div><span id="scene"></span><span id="fps"></span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
