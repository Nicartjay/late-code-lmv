[project]
name = "analysis"
version = "0.1.0"
description = "Audio analysis + Japanese lyric alignment for the 2時のデバッグ music video"
requires-python = ">=3.12,<3.14"
dependencies = [
    "demucs>=4.0.1",
    "torch>=2.6",
    "torchaudio>=2.6",
    "soundfile>=0.12",
    "soxr>=0.5",
    "librosa>=0.10",
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "matplotlib>=3.9",
    "fonttools[woff]>=4.55",
    "fugashi>=1.4",
    "unidic-lite>=1.0.8",
    "mlx-whisper>=0.4.2",
]

[tool.uv]
package = false
